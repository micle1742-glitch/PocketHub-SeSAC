server:
  port: 8080

spring:
  application:
    name: pockethub-backend
  datasource:
    url: ${DB_URL}        # 예: jdbc:postgresql://<호스트>:5432/<DB이름>
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # 스키마는 db/schema-postgres.sql 을 PostgreSQL 에서 직접 실행
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  sql:
    init:
      mode: never
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB # 파일 하나 최대 업로드 크기
      max-request-size: 50MB # multipart 요청 최대 크기

# 업로드 설정: 팀에서 값 확정 후 채움
upload:
  dir: uploads
#  max-size:            # TODO: 파일 1개 최대 크기 (예: 10MB)
#  allowed-extensions:  # TODO: 허용 확장자 목록

jwt:
  secret: ${JWT_SECRET}
  access-expiration-minutes: 60
  refresh-expiration-days: 14

cors:
  allowed-origins: http://localhost:3000